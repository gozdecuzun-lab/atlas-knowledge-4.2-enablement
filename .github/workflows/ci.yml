name: enablement-ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests (quality gates + regeneration proof + LLM guardrail)
        run: python -m pytest -q
      - name: Fail if generated outputs drift from the changelog
        run: python pipeline/generate.py --check
